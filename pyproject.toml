[project]
name = "har-edge-framework"
version = "1.0.0"
description = "End-to-End Framework for AI-Powered Human Activity Recognition on Edge Devices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Nguyen Truong Minh Hoang", email = "ntmhoang.sdh222@edu.hcmut.com" },
]
keywords = ["HAR", "edge-computing", "IMU", "machine-learning", "embedded", "code-generation"]

dependencies = [
    # Core Web Framework
    "dash>=2.14.1",
    "dash-bootstrap-components>=1.5.0",
    # Data Processing & Analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # Machine Learning
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    # Deep Learning — PyTorch MLP & 1D-CNN
    "torch>=2.0.0",
    # Data Visualization
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Serial Communication & Device Interface
    "pyserial>=3.5",
    "tensorflow>=2.21.0",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.14.0",
    "skl2onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]
tflite = [
    "tensorflow>=2.13.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
]
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Repository = "https://github.com/Bill66613/AI_model_generator_framework"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# This is an app, not a library — don't try to build/install it as a package
package = false
python-preference = "system"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]
